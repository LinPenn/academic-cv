hugoblox:
  schema: "2.0"
  identity:
    name: hzclab
    type: organization
    tagline: "AI and Computer Vision Research"
    description: "HZ Lab is dedicated to cutting-edge research in AI, computer vision, and machine learning."
  theme:
    mode: light
    pack: contrast
    colors:
      primary: ""
      secondary: ""
      neutral: ""
  typography:
    font: sans
    size: md
  layout:
    radius: md
    spacing: comfortable
    avatar_shape: circle
  header:
    enable: true
    style: navbar
    sticky: true
    align: center
    search: true
    theme_toggle: true
  footer:
    style: minimal
  copyright:
    notice: "© {year} {name}"
  content:
    math:
      enable: false
    toc:
      enable: true
    reading_time:
      enable: true
  search:
    enable: true
