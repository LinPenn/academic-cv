# ============================================================================
# 页面布局参数
# ----------------------------------------------------------------------------
# 由编辑器「页面布局」模块维护，单位都是 px。
# 数值会在构建时写进页面样式，改完保存 → 预览自动重建即可看到效果。
# 想恢复默认：在编辑器里点「恢复默认值」。
# ============================================================================

home:
  # 首页最顶部的留白（导航栏与标题之间）
  top_gap: 0
  # 大标题：上方留白 / 与下方主图之间的距离
  title_gap_top: 41
  title_gap_bottom: 0
  # 主图最大宽度（窄屏时自动按 92% 宽度缩放）
  image_max_width: 1200
  # 主图与下方正文之间的距离
  image_text_gap: 24
  # 正文最大宽度
  text_max_width: 1100

research:
  # 研究页最顶部的留白
  top_gap: 24
  # 方向卡片区自身的顶部留白
  cards_gap_top: 8
