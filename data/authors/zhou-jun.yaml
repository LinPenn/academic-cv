bio: Focusing on multi-strain, continuously bred Pekin duck populations, I investigate genome-wide genetic variation and the genetic architecture of complex economic traits through whole-genome sequencing. By integrating multi-tissue transcriptomics, regulatory genomics, and molecular quantitative genetics, I systematically characterize the genetic regulatory networks underlying important economic traits, including growth, body conformation, meat quality, and feed efficiency, and identify key candidate genes and functional variants. Building on these findings, I integrate multi-source omics information to optimize genomic prediction models, improve the accuracy and efficiency of genetic evaluation and breeding decisions for complex traits, and advance precision breeding and intelligent breeding systems in poultry.
