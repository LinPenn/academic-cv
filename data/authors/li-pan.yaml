bio: Ph.D. student in Animal Genetics, Breeding and Reproduction at China Agricultural University, with a research focus on animal molecular quantitative genetics. Currently working primarily on the DuckGTEx project, integrating multi-tissue and multi-omics data to construct a gene expression regulatory atlas of Pekin ducks, elucidate the molecular mechanisms by which genetic variation regulates gene expression, and support molecular breeding research in Pekin ducks.
