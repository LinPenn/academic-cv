bio: |
  Currently a second-year master's student in Animal Science at China Agricultural University. My research focuses on the similarities and differences in adipocyte formation and fat deposition between mammals and poultry, with the aim of understanding the conserved and species-specific cellular and molecular mechanisms underlying adipose tissue development from a cross-species comparative perspective. Outside of research, I enjoy working out and playing sports. Rather than living at an overly intense pace, I prefer to maintain a more relaxed state—taking research seriously while also enjoying life
interests:
  - Currently focusing on cross-species comparative studies of adipose tissue in mammals and poultry, with particular emphasis on the conserved and divergent mechanisms underlying adipocyte formation, differentiation, and fat deposition
