bio: My name is Chen Xingchen. I received my bachelor's degree in Animal Science from Henan Agricultural University and have gained research experience in animal genetics and breeding, livestock and poultry production, and egg quality assessment. During my internship, I participated in research-related work including genomic DNA extraction from poultry, egg quality testing, and performance evaluation of broiler chickens, and developed familiarity with basic molecular laboratory techniques and the collection of livestock and poultry phenotypic data. I have a strong interest in animal genetics and breeding and livestock and poultry germplasm resource exploration, with a particular interest in research supporting the breeding of high-quality domestic livestock and poultry breeds. In addition, I have experience in campus new media and volunteer services, with strong skills in document organization, event coordination, and teamwork.
