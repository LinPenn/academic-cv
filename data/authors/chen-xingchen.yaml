      - title: Egg quality analysis
        subtitle: Beijing Huadu Yukou Poultry Co., Ltd.
        meta: 2025.06 - 2025.08
        text: Measured egg weight, Haugh unit, albumen height and yolk color with digital egg scales and egg quality analyzers, and used candling equipment to screen for cracked shells and abnormal air cells, providing baseline data for egg quality assessment.
      - title: Molecular experiments
        subtitle: Beijing Huadu Yukou Poultry Co., Ltd.
        meta: 2025.06 - 2025.08
        text: Extracted genomic DNA from frozen poultry serum samples, becoming proficient in lysis, centrifugation and purification, to obtain high-purity DNA supporting downstream genotyping and population genetic diversity analysis.
