        subtitle: Shandong Smart Slaughterhouse
        meta: 2025.06 - 2025.08
        text: "Took part in performance testing of the domestic white-feathered broiler (Wode 188): body measurements, slaughter and cutting, viscera processing and weighing, collecting phenotypes at both the farm and slaughterhouse ends."
