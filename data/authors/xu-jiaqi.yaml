custom_sections:
  - title: Research Experience
    layout: markdown
    text: Research on dairy cattle genetic breeding at the Shandong Academy of Agricultural Sciences. Combining routine dairy herd improvement (DHI) testing with milk mid-infrared spectra to predict residual feed intake and feed conversion ratio, and to perform genetic evaluation of the related traits, aiming at rapid selection of high-quality dairy cattle and faster genetic progress. Participated in the National Dairy Cattle Industry Technology System, the 14th Five-Year National Key R&D Program, the Shandong Natural Science Foundation, the Shandong Improved Breed Project, and Shandong Key R&D programs. Also explored novel traits from AfiCollar sensor data on commercial farms, and has computed heritability and genetic variance estimates.
