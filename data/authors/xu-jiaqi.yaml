bio: Jiaqi Xu works on dairy cattle genetic breeding. His research uses mid-infrared spectra of milk to predict traits such as residual feed intake and feed conversion ratio, and to carry out genetic evaluation for faster genetic gain. During his graduate studies he served as head of the Outreach Department of the college graduate student association and has extensive on-farm experience with dairy and broiler operations.
