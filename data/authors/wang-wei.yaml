bio: |
  A native of Hefei, Anhui, China, currently pursuing a master's degree in Animal Husbandry at China Agricultural University, specializing in Livestock and Poultry Genetics and Breeding Technology. During my undergraduate studies, I achieved a GPA of 3.19 and systematically studied courses including Animal Genetics and Breeding, Smart Farm Management, Data Analysis, and Deep Learning. I also actively participated in research training and practical activities in animal production. I am down-to-earth, conscientious, and curious, with strong communication skills and the ability to complete assigned tasks on time and to a high standard. I am also passionate about contributing to others and have been actively involved in volunteer services for many years. I hope to further develop my expertise in livestock and poultry genetics and breeding, integrate molecular breeding with smart animal husbandry technologies, and contribute to improving the quality and efficiency of the livestock industry
interests:
  - Livestock and poultry genetic breeding technology
  - Association analysis between functional gene polymorphisms and production traits
  - Smart animal husbandry and biostatistics data analysis
